<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <link rel="stylesheet" href="src/asset/bootstrap/css/bootstrap.min.css" />
  </head>

  <body class="d-flex align-items-center min-vh-100 bg-light">
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card border border-0 shadow rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="mb-4">
                <h1 class="h4 mb-1">
                  <span></span>Bienvenido a la Biblioteca Digital Universitaria
                </h1>
              </div>

              <form id="loginForm" novalidate>
                <!-- Email -->
                <div class="mb-3">
                  <label for="emailUTP" class="form-label"
                    >Correo institucional</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="emailUTP"
                    name="emailUTP"
                    required
                    inputmode="email"
                    placeholder="utp1234567@alumno.utpuebla.edu.mx"
                    pattern="^utp[0-9]{7}@alumno\.utpuebla\.edu\.mx$"
                  />
                  <div class="invalid-feedback" id="emailError">
                    Error en correo.
                  </div>
                  <div class="form-text">
                    Formato: <code>utp</code> + <code>6 dígitos</code> +
                    <code>@alumno.utpuebla.edu.mx</code>
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                    minlength="6"
                    placeholder="Mínimo 6 caracteres"
                  />
                  <div class="invalid-feedback" id="passError">
                    Error en contraseña.
                  </div>
                </div>

                <!-- Matrícula-->
                <div class="mb-4">
                  <label for="matricula" class="form-label"
                    >Matrícula (6 dígitos)</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="matricula"
                    name="matricula"
                    required
                    inputmode="numeric"
                    minlength="7"
                    maxlength="7"
                    pattern="^[0-9]{7}$"
                    placeholder="Ej. 1234567"
                  />
                  <div class="invalid-feedback" id="matError">
                    Error en matrícula.
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Entrar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="src/js/validation.js"></script>
  </body>
</html>
