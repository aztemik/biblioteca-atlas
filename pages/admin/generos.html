<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrar Géneros - Biblioteca Atlas</title>
    <link rel="stylesheet" href="/src/asset/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/asset/font-awesome/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/src/asset/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- HEADER -->
    <header class="border-bottom text-center bg-white">
      <img
        class="d-block mx-auto mb-4"
        src="/src/asset/images/atlas.jpg"
        width="250"
        alt="Logo Biblioteca Atlas"
      />

      <h1 class="display-5 fw-bold text-body-emphasis">Biblioteca Atlas</h1>

      <p class="text-muted lead mb-4">
        <i class="fa fa-quote-left"></i>
        Un mundo de historias en un solo lugar
        <i class="fa fa-quote-right"></i>
      </p>
    </header>

    <!-- BUSCADOR -->
    <section class="bg-light border-bottom">
      <div class="container py-2">
        <form class="d-flex" action="#" role="search" id="searchForm">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-search"></i></span>

            <label for="search" class="visually-hidden">Buscar</label>
            <input
              id="search"
              class="form-control"
              type="search"
              placeholder="Buscar en géneros, libros y autores..."
              autocomplete="off"
            />

            <button class="btn btn-secondary" type="submit">
              <i class="fa fa-arrow-right"></i> Buscar
            </button>
          </div>
        </form>

        <div id="searchResults" class="mt-3"></div>
      </div>
    </section>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark" aria-label="Navegación administrativa">
      <div class="container">
        <ul class="navbar-nav mx-auto flex-row">
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/admin/index.html">Dashboard</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link active" href="/pages/admin/generos.html">Géneros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/admin/libros.html">Libros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/admin/autores.html">Autores</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link text-info" href="/home.html"><i class="fa fa-external-link"></i> Ver Sitio</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Géneros</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#genreModal" id="btnAddGenre">
          <i class="fa fa-plus"></i> Nuevo Género
        </button>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="ps-4">ID</th>
                  <th scope="col">Nombre</th>
                  <th scope="col" class="text-end pe-4">Acciones</th>
                </tr>
              </thead>
              <tbody id="genres-table-body">
                <!-- Cargando... -->
                <tr>
                    <td colspan="3" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL CREAR/EDITAR -->
    <div class="modal fade" id="genreModal" tabindex="-1" aria-labelledby="genreModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="genreModalLabel">Nuevo Género</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="genreForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="genreName" class="form-label">Nombre del Género <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="genreName" name="name" required minlength="3" maxlength="50">
                <div class="invalid-feedback" id="genreNameError">
                  El nombre debe tener entre 3 y 50 caracteres.
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="btnSaveGenre">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white py-3 border-top mt-5">
      <p class="text-center text-body-secondary">&copy; 2026 Biblioteca Atlas, Inc - Panel Admin</p>
    </footer>

    <script src="/src/asset/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/js/admin-generos.js"></script>
  </body>
</html>
