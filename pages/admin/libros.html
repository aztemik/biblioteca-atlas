<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrar Libros - Biblioteca Atlas</title>
    <link rel="stylesheet" href="/src/asset/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/asset/font-awesome/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/src/asset/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- HEADER -->
    <header class="border-bottom text-center bg-white">
      <img
        class="d-block mx-auto mb-4"
        src="/src/asset/images/atlas.jpg"
        width="250"
        alt="Logo Biblioteca Atlas"
      />

      <h1 class="display-5 fw-bold text-body-emphasis">Biblioteca Atlas</h1>

      <p class="text-muted lead mb-4">
        <i class="fa fa-quote-left"></i>
        Un mundo de historias en un solo lugar
        <i class="fa fa-quote-right"></i>
      </p>
    </header>

    <!-- BUSCADOR -->
    <section class="bg-light border-bottom">
      <div class="container py-2">
        <form class="d-flex" action="#" role="search" id="searchForm">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-search"></i></span>

            <label for="search" class="visually-hidden">Buscar</label>
            <input
              id="search"
              class="form-control"
              type="search"
              placeholder="Buscar en géneros, libros y autores..."
              autocomplete="off"
            />

            <button class="btn btn-secondary" type="submit">
              <i class="fa fa-arrow-right"></i> Buscar
            </button>
          </div>
        </form>

        <div id="searchResults" class="mt-3"></div>
      </div>
    </section>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark" aria-label="Navegación administrativa">
      <div class="container">
        <ul class="navbar-nav mx-auto flex-row">
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/admin/index.html">Dashboard</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/admin/generos.html">Géneros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link active" href="/pages/admin/libros.html">Libros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/admin/autores.html">Autores</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link text-info" href="/home.html"><i class="fa fa-external-link"></i> Ver Sitio</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Libros</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookModal" id="btnAddBook">
          <i class="fa fa-plus"></i> Nuevo Libro
        </button>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="ps-4">ID</th>
                  <th scope="col">Título</th>
                  <th scope="col">Stock</th>
                  <th scope="col">Precio</th>
                  <th scope="col" class="text-end pe-4">Acciones</th>
                </tr>
              </thead>
              <tbody id="books-table-body">
                <tr>
                    <td colspan="5" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL CREAR/EDITAR -->
    <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="bookModalLabel">Nuevo Libro</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="bookForm" enctype="multipart/form-data">
            <div class="modal-body">
              <div class="row g-3">
                <!-- Información Básica -->
                <div class="col-md-6">
                  <label for="bookName" class="form-label">Título <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="bookName" name="name" required>
                </div>
                <div class="col-md-3">
                  <label for="bookGenre" class="form-label">Género <span class="text-danger">*</span></label>
                  <select class="form-select" id="bookGenre" name="genreId" required>
                    <option value="">Seleccione...</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label for="bookAuthor" class="form-label">Autor <span class="text-danger">*</span></label>
                  <select class="form-select" id="bookAuthor" name="authorId" required>
                    <option value="">Seleccione...</option>
                  </select>
                </div>

                <!-- Clasificación y Precios -->
                <div class="col-md-3">
                  <label for="bookYear" class="form-label">Año</label>
                  <input type="number" class="form-control" id="bookYear" name="year">
                </div>
                <div class="col-md-3">
                  <label for="bookRating" class="form-label">Rating (0-5)</label>
                  <input type="number" class="form-control" id="bookRating" name="rating" step="0.1" min="0" max="5">
                </div>
                <div class="col-md-3">
                  <label for="bookPrice" class="form-label">Precio</label>
                  <input type="number" class="form-control" id="bookPrice" name="price" step="0.01">
                </div>
                <div class="col-md-3">
                  <label for="bookStock" class="form-label">Stock</label>
                  <input type="number" class="form-control" id="bookStock" name="stock">
                </div>

                <!-- Identificadores -->
                <div class="col-md-6">
                  <label for="bookPublisher" class="form-label">Editorial</label>
                  <input type="text" class="form-control" id="bookPublisher" name="publisher">
                </div>
                <div class="col-md-6">
                  <label for="bookSku" class="form-label">SKU</label>
                  <input type="text" class="form-control" id="bookSku" name="sku">
                </div>

                <!-- Descripciones -->
                <div class="col-12">
                  <label for="bookDescription" class="form-label">Descripción Corta</label>
                  <input type="text" class="form-control" id="bookDescription" name="description">
                </div>
                <div class="col-12">
                  <label for="bookSinopsis" class="form-label">Sinopsis</label>
                  <textarea class="form-control" id="bookSinopsis" name="sinopsis" rows="3"></textarea>
                </div>

                <!-- Extras -->
                <div class="col-md-6">
                  <label for="bookTags" class="form-label">Tags (separados por coma)</label>
                  <input type="text" class="form-control" id="bookTags" name="tags" placeholder="Fantasia, Aventuras, Epico">
                </div>
                <div class="col-md-6">
                  <label for="bookImage" class="form-label">Imagen de Portada</label>
                  <input type="file" class="form-control" id="bookImage" name="image" accept="image/*">
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="btnSaveBook">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white py-3 border-top mt-5">
      <p class="text-center text-body-secondary">&copy; 2026 Biblioteca Atlas, Inc - Panel Admin</p>
    </footer>

    <script src="/src/asset/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/js/admin-libros.js"></script>
  </body>
</html>
