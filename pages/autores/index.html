<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autores - Biblioteca Atlas</title>

    <meta
      name="description"
      content="Lista de autores disponibles en Biblioteca Atlas"
    />

    <link rel="stylesheet" href="/src/asset/bootstrap/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="/src/asset/font-awesome/css/font-awesome.min.css"
    />
  </head>

  <body class="bg-light">
    <!-- HEADER -->
    <header class="border-bottom text-center bg-white">
      <img
        class="d-block mx-auto mb-4"
        src="/src/asset/images/atlas.jpg"
        width="250"
        alt="Logo Biblioteca Atlas"
      />

      <h1 class="display-5 fw-bold text-body-emphasis">Biblioteca Atlas</h1>

      <p class="text-muted lead mb-4">
        <i class="fa fa-quote-left"></i>
        Un mundo de historias en un solo lugar
        <i class="fa fa-quote-right"></i>
      </p>
    </header>

    <!-- BUSCADOR -->
    <section class="bg-light border-bottom">
      <div class="container py-2">
        <form class="d-flex" action="#" role="search" id="searchForm">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-search"></i></span>

            <label for="search" class="visually-hidden">Buscar</label>
            <input
              id="search"
              class="form-control"
              type="search"
              placeholder="Buscar en géneros, libros y autores..."
              autocomplete="off"
            />

            <button class="btn btn-secondary" type="submit">
              <i class="fa fa-arrow-right"></i> Buscar
            </button>
          </div>
        </form>

        <div id="searchResults" class="mt-3"></div>
      </div>
    </section>


    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark" aria-label="Navegación principal">
      <div class="container">
        <ul class="navbar-nav mx-auto flex-row">
          <li class="nav-item px-3">
            <a class="nav-link" href="/home.html">Géneros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/libros/index.html">Libros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link active" aria-current="page" href="index.html"
              >Autores</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-4">
      <section class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <h2 class="text-center mb-4">Autores disponibles</h2>

          <div id="authors-container" class="row g-4">
            <!-- CONTENIDO DINAMICO -->
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white py-3 border-top">
      <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item">
          <a href="/home.html" class="nav-link px-2 text-body-secondary">Géneros</a>
        </li>
        <li class="nav-item">
          <a href="/pages/libros/index.html" class="nav-link px-2 text-body-secondary">Libros</a>
        </li>
        <li class="nav-item">
          <a href="/pages/autores/index.html" class="nav-link px-2 text-body-secondary">Autores</a>
        </li>
      </ul>
      <p class="text-center text-body-secondary">&copy; 2026 Biblioteca Atlas, Inc</p>
    </footer>

    <script src="/src/asset/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../src/js/autores.js"></script>
    <script type="module" src="../../src/js/buscador.js"></script>
  </body>
</html>
