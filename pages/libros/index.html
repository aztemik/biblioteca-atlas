<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Atlas - Fantasía</title>
    <meta
      name="description"
      content="Libros de fantasía disponibles en Biblioteca Atlas"
    />

    <link rel="stylesheet" href="/src/asset/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/asset/font-awesome/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/src/asset/css/style.css" />
    <style>
      .book-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        overflow: hidden;
      }
      .book-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.15) !important;
      }
      .card-img-container {
        position: relative;
        overflow: hidden;
        aspect-ratio: 2/3;
      }
      .card-img-top {
        transition: transform 0.5s ease;
        object-fit: cover;
        height: 100%;
      }
      .book-card:hover .card-img-top {
        transform: scale(1.1);
      }
      .genre-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        backdrop-filter: blur(5px);
        background: rgba(13, 110, 253, 0.8) !important;
      }
      .rating-badge {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 2;
        background: rgba(255, 193, 7, 0.9);
        color: #000;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
      }
    </style>
  </head>

  <body class="bg-light">
    <!-- HEADER -->
    <header class="border border-bottom text-center bg-white">
      <img
        class="d-block mx-auto mb-4"
        src="/src/asset/images/atlas.jpg"
        width="250"
        alt="Logo Biblioteca Atlas"
      />

      <h1 class="display-5 fw-bold text-body-emphasis">Biblioteca Atlas</h1>

      <p class="text-muted lead mb-4">
        <i class="fa fa-quote-left"></i>
        Un mundo de historias en un solo lugar
        <i class="fa fa-quote-right"></i>
      </p>
    </header>

    <!-- BUSCADOR -->
    <section class="bg-light border-bottom">
      <div class="container py-2">
        <form class="d-flex" action="#" role="search" id="searchForm">
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-search"></i></span>

            <label for="search" class="visually-hidden">Buscar</label>
            <input
              id="search"
              class="form-control"
              type="search"
              placeholder="Buscar en géneros, libros y autores..."
              autocomplete="off"
            />

            <button class="btn btn-secondary" type="submit">
              <i class="fa fa-arrow-right"></i> Buscar
            </button>
          </div>
        </form>

        <div id="searchResults" class="mt-3"></div>
      </div>
    </section>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark" aria-label="Navegación principal">
      <div class="container">
        <ul class="navbar-nav mx-auto flex-row">
          <li class="nav-item px-3">
            <a class="nav-link" href="/home.html">Géneros</a>
          </li>
          <li class="nav-item px-3">
            <a class="nav-link active" href="/pages/libros/index.html"
              >Libros</a
            >
          </li>
          <li class="nav-item px-3">
            <a class="nav-link" href="/pages/autores/index.html">Autores</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-4">
      <section class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div id="books-container" class="row g-4">
            <!-- CONTENIDO DINAMICO -->
          </div>
          <div id="pagination-container" class="mt-4">
            <!-- PAGINACION -->
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white py-3 border-top">
      <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item">
          <a href="/home.html" class="nav-link px-2 text-body-secondary">Géneros</a>
        </li>
        <li class="nav-item">
          <a href="/pages/libros/index.html" class="nav-link px-2 text-body-secondary">Libros</a>
        </li>
        <li class="nav-item">
          <a href="/pages/autores/index.html" class="nav-link px-2 text-body-secondary">Autores</a>
        </li>
      </ul>
      <p class="text-center text-body-secondary">&copy; 2026 Biblioteca Atlas, Inc</p>
    </footer>

    <script src="/src/asset/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../src/js/libros.js"></script>
    <script type="module" src="../../src/js/buscador.js"></script>
  </body>
</html>
